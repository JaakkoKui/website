<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ketunkolo Games</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      :root {
        --radius: 10px;
        --card: #0b111b;
        --card-b: #27313d;
        --accent: #ff7b29;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: #e6edf3;
        background: #0d1117;
        font-family: system-ui, sans-serif;
        overflow: hidden; /* prevent page scroll */
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
        margin: 0 auto;
        max-width: 1100px;
      }
      .wrap.mobile-full {
        padding: 0;
        gap: 0;
        max-width: none;
        height: 100dvh;
        width: 100dvw;
      }
      .breadcrumb {
        font-size: 0.85rem;
        margin: 0;
      }
      .breadcrumb a {
        color: #9acaff;
        text-decoration: none;
      }
      .wrap.mobile-full .breadcrumb,
      .wrap.mobile-full h1 {
        display: none;
      }
      .wrap.mobile-full .controls {
        display: flex;
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 50;
        margin: 0;
      }
      .wrap.mobile-full .controls .fs-btn {
        background: rgba(11, 17, 27, 0.85);
        border-color: rgba(39, 49, 61, 0.9);
        border-radius: 999px;
        padding: 0.45rem 0.85rem;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .controls .fs-btn {
        margin-left: auto;
        background: var(--card);
        border: 1px solid var(--card-b);
        color: inherit;
        padding: 0.4rem 0.7rem;
        border-radius: 8px;
        cursor: pointer;
      }
      .controls .fs-btn:hover {
        border-color: var(--accent);
      }
      /* Stage wrapper will be explicitly sized to game aspect */
      .stage {
        position: relative;
        align-self: stretch;
        width: 100%;
        max-width: 100%;
        height: 60vh;
        min-height: 300px;
      }
      .wrap.is-mobile .stage {
        min-height: 240px;
      }
      .wrap.mobile-full .stage {
        flex: 1;
        height: 100%;
        min-height: 100%;
        width: 100%;
      }
      .game-frame {
        display: block;
        width: 100%;
        height: 100%;
        background: #111;
        border: 1px solid var(--card-b);
        border-radius: var(--radius);
      }
      .wrap.mobile-full .game-frame {
        border-radius: 0;
        border: none;
      }
      #game-error {
        margin: 0.25rem 0 0;
        color: #f88;
        font-weight: 600;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="breadcrumb"><a href="../index.html">← Etusivulle</a></p>
      <h1>The Game</h1>
      <div class="controls">
        <button id="fs-btn" type="button" class="fs-btn">Fullscreen</button>
      </div>
      <div id="stage" class="stage">
        <iframe
          id="game-frame"
          title="Game"
          loading="lazy"
          allow="fullscreen; orientation-lock"
          allowfullscreen
          scrolling="no"
          class="game-frame"
          style="border: none"
        ></iframe>
      </div>
      <div id="game-error"></div>

      <script>
        (function () {
          const frame = document.getElementById("game-frame");
          const stage = document.getElementById("stage");
          const fsBtn = document.getElementById("fs-btn");

          // Fixed game source (no fallback)
          const GAME_SRC = "v2/index.html";
          frame.src = GAME_SRC;

          const wrap = document.querySelector(".wrap");
          const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
          );
          const isFullscreen = () =>
            document.fullscreenElement === frame ||
            document.webkitFullscreenElement === frame;

          function viewport() {
            const vv = window.visualViewport;
            return {
              width: Math.round((vv && vv.width) || window.innerWidth),
              height: Math.round((vv && vv.height) || window.innerHeight),
            };
          }

          function tryLockLandscape() {
            if (!("orientation" in screen) || !screen.orientation?.lock) {
              return;
            }
            screen.orientation.lock("landscape").catch(() => {});
          }

          function layout() {
            if (!wrap) return;

            if (isFullscreen()) {
              const { width, height } = viewport();
              stage.style.width = `${width}px`;
              stage.style.height = `${height}px`;
              return;
            }

            if (isMobile) {
              wrap.classList.add("mobile-full");
              wrap.classList.remove("is-mobile");
              const { width, height } = viewport();
              stage.style.width = `${width}px`;
              stage.style.height = `${height}px`;
              stage.style.minHeight = `${height}px`;
              return;
            }

            wrap.classList.remove("mobile-full");
            const rect = stage.getBoundingClientRect();
            const topSpace = rect.top;
            const availH = Math.max(320, window.innerHeight - topSpace - 12);
            const availW = Math.max(320, wrap.clientWidth);
            wrap.classList.toggle("is-mobile", availW < 640);
            stage.style.width = `${Math.round(availW)}px`;
            stage.style.height = `${Math.round(availH)}px`;
          }

          window.addEventListener("resize", layout, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", layout, {
              passive: true,
            });
          }
          if (screen.orientation && screen.orientation.addEventListener) {
            screen.orientation.addEventListener("change", layout);
          }
          document.addEventListener("fullscreenchange", layout);
          document.addEventListener("webkitfullscreenchange", layout);
          layout();

          // Fullscreen toggle
          function updateFsBtn() {
            fsBtn.textContent = isFullscreen()
              ? "Exit Fullscreen"
              : "Fullscreen";
            if (isMobile) {
              fsBtn.style.display = "inline-flex";
            }
          }
          function enterFs(el) {
            let req;
            if (el.requestFullscreen) req = el.requestFullscreen();
            else if (el.webkitRequestFullscreen)
              req = el.webkitRequestFullscreen(); // Safari

            if (req && typeof req.then === "function") {
              req.then(() => {
                tryLockLandscape();
                layout();
              });
            } else {
              tryLockLandscape();
              layout();
            }
            return req;
          }
          function exitFs() {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen)
              return document.webkitExitFullscreen();
          }
          fsBtn.addEventListener("click", () => {
            if (isFullscreen()) exitFs();
            else enterFs(frame);
          });
          document.addEventListener("fullscreenchange", updateFsBtn);
          document.addEventListener("webkitfullscreenchange", updateFsBtn);
          updateFsBtn();

          if (isMobile) {
            const armFs = () => {
              if (isFullscreen()) return;
              enterFs(frame)?.catch(() => {});
            };
            window.addEventListener("touchend", armFs, { once: true });
            window.addEventListener("pointerup", armFs, { once: true });
          }
        })();
      </script>
    </div>
  </body>
</html>
