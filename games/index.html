<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ketunkolo Games</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      :root {
        --radius: 10px;
        --card: #0b111b;
        --card-b: #27313d;
        --accent: #ff7b29;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: #e6edf3;
        background: #0d1117;
        font-family: system-ui, sans-serif;
        overflow: hidden; /* prevent page scroll */
      }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        padding: 1rem;
        margin: 0 auto;
        max-width: 1100px;
      }
      .breadcrumb {
        font-size: 0.85rem;
        margin: 0;
      }
      .breadcrumb a {
        color: #9acaff;
        text-decoration: none;
      }
      h1 {
        margin: 0;
        font-size: 1.6rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .controls .fs-btn {
        margin-left: auto;
        background: var(--card);
        border: 1px solid var(--card-b);
        color: inherit;
        padding: 0.4rem 0.7rem;
        border-radius: 8px;
        cursor: pointer;
      }
      .controls .fs-btn:hover {
        border-color: var(--accent);
      }
      /* Stage wrapper will be explicitly sized to game aspect */
      .stage {
        position: relative;
        align-self: center;
        width: 100%;
        height: 0; /* JS sets real height */
        max-width: 100%;
      }
      .game-frame {
        display: block;
        width: 100%;
        height: 100%;
        background: #111;
        border: 1px solid var(--card-b);
        border-radius: var(--radius);
      }
      #game-error {
        margin: 0.25rem 0 0;
        color: #f88;
        font-weight: 600;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="breadcrumb"><a href="../index.html">← Etusivulle</a></p>
      <h1>The Game</h1>
      <div class="controls">
        <button id="fs-btn" type="button" class="fs-btn">Fullscreen</button>
      </div>
      <div id="stage" class="stage">
        <iframe
          id="game-frame"
          title="Game"
          loading="lazy"
          allowfullscreen
          scrolling="no"
          class="game-frame"
          style="border: none"
        ></iframe>
        <h1 style="color: #888; text-align: center; padding: 2rem">
          Peli tulossa joskus 🦊
        </h1>
      </div>
      <div id="game-error"></div>

      <script>
        (function () {
          const frame = document.getElementById("game-frame");
          const stage = document.getElementById("stage");
          const fsBtn = document.getElementById("fs-btn");

          // Fixed game source (no fallback)
          const GAME_SRC = "v2/index.html";
          const GAME_ASPECT = 4 / 3; // 4:3 for Phaser v2
          stage.dataset.aspect = String(GAME_ASPECT);
          frame.src = GAME_SRC;

          function layout() {
            const aspect = Number(stage.dataset.aspect || 16 / 9);
            const wrap = document.querySelector(".wrap");
            const rectStageTop = stage.getBoundingClientRect();
            const topSpace = rectStageTop.top;
            const availH = Math.max(0, window.innerHeight - topSpace - 8);
            const availW = wrap.clientWidth;
            let w = Math.min(availW, Math.floor(availH * aspect));
            let h = Math.floor(w / aspect);
            if (w <= 0 || h <= 0) {
              w = Math.min(availW, Math.floor(window.innerHeight * 0.9));
              h = Math.floor(w / aspect);
            }
            stage.style.width = w + "px";
            stage.style.height = h + "px";
          }

          window.addEventListener("resize", layout);
          document.addEventListener("fullscreenchange", layout);
          document.addEventListener("webkitfullscreenchange", layout);
          layout();

          // Fullscreen toggle
          function isFs() {
            return (
              document.fullscreenElement || document.webkitFullscreenElement
            );
          }
          function updateFsBtn() {
            fsBtn.textContent = isFs() ? "Exit Fullscreen" : "Fullscreen";
          }
          function enterFs(el) {
            if (el.requestFullscreen) return el.requestFullscreen();
            if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen(); // Safari
          }
          function exitFs() {
            if (document.exitFullscreen) return document.exitFullscreen();
            if (document.webkitExitFullscreen)
              return document.webkitExitFullscreen();
          }
          fsBtn.addEventListener("click", () => {
            if (isFs()) exitFs();
            else enterFs(frame);
          });
          document.addEventListener("fullscreenchange", updateFsBtn);
          document.addEventListener("webkitfullscreenchange", updateFsBtn);
          updateFsBtn();
        })();
      </script>
    </div>
  </body>
</html>
